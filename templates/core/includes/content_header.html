<div class="app-content-header">
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-6">
        <h3 class="mb-0">{{ title }}</h3>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-end">
          <li class="breadcrumb-item"><a href="{% url 'core:dashboard' %}">Home</a></li>
          {% for crumb in breadcrumbs %}<li class="breadcrumb-item{% if crumb.active %} active{% endif %}"><a href="{{ crumb.url }}">{{ crumb.label }}</a></li>{% endfor %}
        </ol>
      </div>
    </div>
  </div>
</div>
